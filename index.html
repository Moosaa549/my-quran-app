```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Quran App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5f1;
    color: #17231f;
    transition: 0.3s;
}

body.dark {
    background: #101716;
    color: #eeeeee;
}

header {
    background: linear-gradient(135deg, #075e54, #087f5b);
    color: white;
    padding: 28px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
}

.controls {
    position: sticky;
    top: 0;
    z-index: 20;
    background: white;
    padding: 15px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    box-shadow: 0 3px 12px #0002;
}

body.dark .controls {
    background: #18201e;
}

select,
input,
button {
    border: none;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 15px;
}

select,
input {
    background: #eeeeee;
    color: #222;
}

button {
    background: #087f5b;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #056b4c;
}

.container {
    max-width: 950px;
    margin: 25px auto 130px;
    padding: 0 15px;
}

.surah-title {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: 0 4px 15px #0001;
}

body.dark .surah-title,
body.dark .ayah {
    background: #1b2421;
}

.surah-title h2 {
    margin: 0;
    color: #087f5b;
    font-size: 27px;
}

.surah-title p {
    margin: 7px;
}

.ayah {
    background: white;
    border-radius: 18px;
    margin-bottom: 18px;
    padding: 22px;
    box-shadow: 0 4px 15px #0001;
}

.ayah-number {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #087f5b;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
    font-weight: bold;
}

.arabic {
    direction: rtl;
    text-align: right;
    font-size: 30px;
    line-height: 2.1;
    font-family: "Traditional Arabic", "Noto Naskh Arabic", serif;
}

.meaning {
    margin-top: 17px;
    padding: 15px;
    border-left: 4px solid #087f5b;
    background: #f1f8f5;
    border-radius: 8px;
    line-height: 1.8;
    font-size: 17px;
}

body.dark .meaning {
    background: #26332f;
}

.hidden {
    display: none !important;
}

.ayah-buttons {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.ayah-buttons button {
    font-size: 13px;
    padding: 8px 12px;
}

.loading {
    text-align: center;
    padding: 40px;
    font-size: 20px;
}

.error {
    background: #ffdddd;
    color: #900;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}

.player {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 30;
    background: #075e54;
    color: white;
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    box-shadow: 0 -3px 15px #0003;
}

.player button {
    background: white;
    color: #075e54;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    padding: 0;
}

.player span {
    min-width: 160px;
    text-align: center;
}

#progress {
    width: 180px;
}

@media(max-width:600px) {

    header h1 {
        font-size: 25px;
    }

    .arabic {
        font-size: 25px;
    }

    .player {
        gap: 6px;
    }

    #progress {
        width: 120px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📖 My Quran App</h1>
    <p>Read • Listen • Understand</p>
</header>

<div class="controls">

    <select id="surahSelect">
        <option>Loading Surahs...</option>
    </select>

    <select id="languageSelect">
        <option value="english">🇬🇧 English Meaning</option>
        <option value="tamil">🇱🇰 தமிழ் அர்த்தம்</option>
    </select>

    <select id="reciterSelect">

        <option value="ar.alafasy">
            🎙️ Mishary Alafasy
        </option>

        <option value="ar.abdulbasitmurattal">
            🎙️ Abdul Basit
        </option>

        <option value="ar.husary">
            🎙️ Mahmoud Al-Husary
        </option>

        <option value="ar.minshawi">
            🎙️ Al-Minshawi
        </option>

        <option value="ar.sudais">
            🎙️ Abdul Rahman Al-Sudais
        </option>

    </select>

    <input
        id="searchBox"
        type="text"
        placeholder="🔎 Search surahs..."
    >

    <button onclick="toggleDarkMode()">
        🌙
    </button>

</div>


<div class="container">

    <div id="content">

        <div class="loading">
            Loading Quran...
        </div>

    </div>

</div>


<div class="player">

    <button onclick="previousAyah()">⏮</button>

    <button onclick="togglePlay()">▶</button>

    <button onclick="nextAyah()">⏭</button>

    <span id="nowPlaying">
        Nothing playing
    </span>

    <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
    >

</div>


<audio id="audio"></audio>


<script>

const API = "https://api.alquran.cloud/v1";

const CDN = "https://cdn.islamic.network/quran/audio/128";


let currentSurah = 1;

let currentAyah = 0;

let ayahs = [];

let language = localStorage.getItem("language") || "english";

let reciter =
    localStorage.getItem("reciter") || "ar.alafasy";


const surahSelect =
    document.getElementById("surahSelect");

const languageSelect =
    document.getElementById("languageSelect");

const reciterSelect =
    document.getElementById("reciterSelect");

const content =
    document.getElementById("content");

const audio =
    document.getElementById("audio");

const nowPlaying =
    document.getElementById("nowPlaying");

const progress =
    document.getElementById("progress");

const searchBox =
    document.getElementById("searchBox");


languageSelect.value = language;

reciterSelect.value = reciter;


/* =========================
   LOAD SURAH LIST
========================= */

async function loadSurahs() {

    try {

        const response =
            await fetch(`${API}/surah`);

        const result =
            await response.json();

        surahSelect.innerHTML = "";

        result.data.forEach(surah => {

            const option =
                document.createElement("option");

            option.value = surah.number;

            option.textContent =
                `${surah.number}. ${surah.englishName} — ${surah.name}`;

            surahSelect.appendChild(option);

        });

        surahSelect.value = currentSurah;

        loadSurah(currentSurah);

    }

    catch(error) {

        content.innerHTML = `
            <div class="error">
                ❌ Could not load the Quran.
                <br><br>
                Please check your internet connection.
            </div>
        `;

    }

}


/* =========================
   LOAD SURAH
========================= */

async function loadSurah(number) {

    currentSurah = Number(number);

    content.innerHTML = `
        <div class="loading">
            📖 Loading Surah...
        </div>
    `;

    try {

        /*
        Arabic + English + Tamil
        */

        const url =
        `${API}/surah/${number}/editions/` +
        `quran-uthmani,en.asad,ta.asad`;

        const response =
            await fetch(url);

        const result =
            await response.json();

        const editions =
            result.data;

        const arabic =
            editions[0];

        const english =
            editions[1];

        const tamil =
            editions[2];

        ayahs = [];

        for(let i = 0; i < arabic.ayahs.length; i++) {

            ayahs.push({

                arabic:
                    arabic.ayahs[i].text,

                english:
                    english.ayahs[i]
                        ? english.ayahs[i].text
                        : "",

                tamil:
                    tamil.ayahs[i]
                        ? tamil.ayahs[i].text
                        : "",

                number:
                    arabic.ayahs[i].numberInSurah,

                globalNumber:
                    arabic.ayahs[i].number

            });

        }

        displaySurah(
            arabic.surah,
            english,
            tamil
        );

    }

    catch(error) {

        content.innerHTML = `
            <div class="error">
                ❌ Could not load this Surah.
                <br><br>
                Try again.
            </div>
        `;

        console.error(error);

    }

}


/* =========================
   DISPLAY SURAH
========================= */

function displaySurah(
    surah,
    english,
    tamil
) {

    let html = "";

    html += `

        <div class="surah-title">

            <h2>
                ${surah.name}
            </h2>

            <p>
                ${surah.englishName}
            </p>

            <p>
                ${surah.englishNameTranslation}
                • ${surah.numberOfAyahs} Ayahs
                • ${surah.revelationType}
            </p>

        </div>
    `;


    ayahs.forEach((ayah, index) => {

        html += `

        <div
            class="ayah"
            id="ayah-${index}"
        >

            <div class="ayah-number">
                ${ayah.number}
            </div>

            <div class="arabic">
                ${ayah.arabic}
            </div>

            <div
                class="meaning englishMeaning
                ${language === "english"
                    ? ""
                    : "hidden"}"
            >
                <strong>English</strong>
                <br>
                ${ayah.english}
            </div>

            <div
                class="meaning tamilMeaning
                ${language === "tamil"
                    ? ""
                    : "hidden"}"
            >
                <strong>தமிழ்</strong>
                <br>
                ${ayah.tamil}
            </div>

            <div class="ayah-buttons">

                <button
                    onclick="playAyah(${index})"
                >
                    ▶ Play
                </button>

                <button
                    onclick="copyAyah(${index})"
                >
                    📋 Copy
                </button>

            </div>

        </div>
        `;

    });

    content.innerHTML = html;

}


/* =========================
   LANGUAGE
========================= */

languageSelect.addEventListener(
    "change",
    function() {

        language = this.value;

        localStorage.setItem(
            "language",
            language
        );

        updateLanguage();

    }
);


function updateLanguage() {

    const english =
        document.querySelectorAll(
            ".englishMeaning"
        );

    const tamil =
        document.querySelectorAll(
            ".tamilMeaning"
        );

    if(language === "english") {

        english.forEach(
            item =>
                item.classList.remove("hidden")
        );

        tamil.forEach(
            item =>
                item.classList.add("hidden")
        );

    }

    else {

        english.forEach(
            item =>
                item.classList.add("hidden")
        );

        tamil.forEach(
            item =>
                item.classList.remove("hidden")
        );

    }

}


/* =========================
   RECITER
========================= */

reciterSelect.addEventListener(
    "change",
    function() {

        reciter = this.value;

        localStorage.setItem(
            "reciter",
            reciter
        );

    }
);


/* =========================
   PLAY AYAH
========================= */

function playAyah(index) {

    if(!ayahs[index]) return;

    currentAyah = index;

    const globalNumber =
        ayahs[index].globalNumber;

    audio.src =
        `${CDN}/${reciter}/${globalNumber}.mp3`;

    audio.play();

    nowPlaying.textContent =
        `Ayah ${ayahs[index].number}`;

    document
        .getElementById(`ayah-${index}`)
        ?.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay() {

    if(!audio.src) {

        playAyah(0);

        return;
    }

    if(audio.paused) {

        audio.play();

    }

    else {

        audio.pause();

    }

}


/* =========================
   NEXT
========================= */

function nextAyah() {

    if(currentAyah < ayahs.length - 1) {

        playAyah(currentAyah + 1);

    }

    else {

        /*
        End of Surah
        */

        nowPlaying.textContent =
            "End of Surah";

    }

}


/* =========================
   PREVIOUS
========================= */

function previousAyah() {

    if(currentAyah > 0) {

        playAyah(currentAyah - 1);

    }

}


/* =========================
   AUTO NEXT
========================= */

audio.addEventListener(
    "ended",
    function() {

        nextAyah();

    }
);


/* =========================
   PROGRESS
========================= */

audio.addEventListener(
    "timeupdate",
    function() {

        if(audio.duration) {

            progress.value =
                (audio.currentTime /
                audio.duration) * 100;

        }

    }
);


progress.addEventListener(
    "input",
    function() {

        if(audio.duration) {

            audio.currentTime =
                (progress.value / 100) *
                audio.duration;

        }

    }
);


/* =========================
   COPY AYAH
========================= */

function copyAyah(index) {

    const ayah = ayahs[index];

    const meaning =
        language === "english"
            ? ayah.english
            : ayah.tamil;

    const text =
        `${ayah.arabic}\n\n${meaning}`;

    navigator.clipboard.writeText(text);

    alert("Ayah copied! 📋");

}


/* =========================
   DARK MODE
========================= */

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
    );

}


if(
    localStorage.getItem("darkMode")
    === "true"
) {

    document.body.classList.add("dark");

}


/* =========================
   SURAH CHANGE
========================= */

surahSelect.addEventListener(
    "change",
    function() {

        loadSurah(this.value);

    }
);


/* =========================
   SEARCH
========================= */

searchBox.addEventListener(
    "input",
    function() {

        const search =
            this.value.toLowerCase();

        const options =
            surahSelect.querySelectorAll(
                "option"
            );

        options.forEach(option => {

            option.style.display =
                option.textContent
                .toLowerCase()
                .includes(search)
                    ? ""
                    : "none";

        });

    }
);


/* =========================
   START APP
========================= */

loadSurahs();

</script>

</body>
</html>
```
