
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Quran</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f8f6;
    color: #18352b;
}

header {
    background: linear-gradient(135deg, #087f5b, #0b9b70);
    color: white;
    padding: 25px 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.12);
}

header h1 {
    margin: 0;
    font-size: 34px;
}

header p {
    margin: 7px 0 0;
    opacity: 0.9;
}

.container {
    max-width: 1050px;
    margin: 25px auto;
    padding: 0 15px;
}

.panel {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

select,
input,
button {
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #d4e2dc;
    padding: 12px;
}

select,
input {
    width: 100%;
    background: #fbfdfc;
}

button {
    cursor: pointer;
    border: none;
    background: #087f5b;
    color: white;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-1px);
    background: #066d4e;
}

button.secondary {
    background: #e8f4ef;
    color: #087f5b;
}

button.red {
    background: #d94b4b;
}

button.orange {
    background: #d88a20;
}

.range-box {
    margin-top: 20px;
    padding: 18px;
    background: #f1f8f5;
    border-radius: 15px;
}

.range-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 10px;
}

.repeat-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.surah-title {
    text-align: center;
    padding: 10px;
}

.surah-title h2 {
    margin: 5px;
    font-size: 30px;
}

.surah-title p {
    color: #648077;
}

.ayah {
    background: #ffffff;
    border: 1px solid #e3eee9;
    border-radius: 18px;
    margin: 15px 0;
    padding: 22px;
    transition: 0.2s;
}

.ayah.active {
    border: 2px solid #0b9b70;
    box-shadow: 0 5px 18px rgba(11,155,112,0.15);
}

.ayah-number {
    display: inline-flex;
    width: 36px;
    height: 36px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #087f5b;
    color: white;
    font-weight: bold;
    margin-bottom: 15px;
}

.arabic {
    direction: rtl;
    text-align: right;
    font-size: 29px;
    line-height: 2.1;
    font-family: "Times New Roman", serif;
    margin-bottom: 15px;
}

.meaning {
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    background: #f7faf9;
}

.meaning strong {
    color: #087f5b;
}

.hidden {
    display: none;
}

.status {
    text-align: center;
    font-weight: bold;
    padding: 10px;
    color: #087f5b;
}

.loading {
    text-align: center;
    padding: 30px;
    font-size: 18px;
}

@media(max-width:700px) {

    .controls,
    .range-grid {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 28px;
    }

    .arabic {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🕌 My Quran</h1>
    <p>Read • Listen • Learn</p>
</header>

<div class="container">

    <div class="panel">

        <div class="controls">

            <select id="surahSelect">
                <option value="">Loading Surahs...</option>
            </select>

            <select id="reciter">
                <option value="ar.alafasy">Mishary Alafasy</option>
                <option value="ar.abdulbasitmurattal">
                    Abdul Basit
                </option>
                <option value="ar.husary">
                    Mahmoud Al-Husary
                </option>
                <option value="ar.minshawi">
                    Al-Minshawi
                </option>
            </select>

            <button onclick="toggleMeaning()">
                📖 Meaning ON / OFF
            </button>

            <button class="secondary" onclick="loadSurah()">
                🔄 Reload Surah
            </button>

        </div>

        <div class="range-box">

            <h3>🔁 Repeat Ayah Range</h3>

            <p>
                Choose which ayahs should repeat.
                Example: <b>1 → 9</b> will play Ayahs 1 through 9,
                then start again from Ayah 1.
            </p>

            <div class="range-grid">

                <div>
                    <label>Start Ayah</label>
                    <input
                        type="number"
                        id="startAyah"
                        min="1"
                        value="1"
                    >
                </div>

                <div>
                    <label>End Ayah</label>
                    <input
                        type="number"
                        id="endAyah"
                        min="1"
                        value="9"
                    >
                </div>

            </div>

            <div class="repeat-buttons">

                <button onclick="startRepeat()">
                    ▶ Start Repeat
                </button>

                <button class="secondary" onclick="pauseAudio()">
                    ⏸ Pause
                </button>

                <button class="red" onclick="stopAudio()">
                    ⏹ Stop
                </button>

            </div>

            <div id="status" class="status">
                Ready
            </div>

        </div>

    </div>

    <div class="panel">

        <div class="surah-title">
            <h2 id="surahName">Select a Surah</h2>
            <p id="surahInfo"></p>
        </div>

        <div id="quran">
            <div class="loading">
                Choose a Surah above.
            </div>
        </div>

    </div>

</div>

<audio id="audioPlayer"></audio>

<script>

const API = "https://api.alquran.cloud/v1";

let currentSurah = null;
let ayahs = [];

let meaningVisible = true;

let repeatStart = 1;
let repeatEnd = 9;

let currentPlayIndex = 0;
let repeating = false;

const audio = document.getElementById("audioPlayer");


// -----------------------------------------
// LOAD SURAH LIST
// -----------------------------------------

async function loadSurahList() {

    try {

        const response =
            await fetch(API + "/surah");

        const json = await response.json();

        const select =
            document.getElementById("surahSelect");

        select.innerHTML = "";

        json.data.forEach(surah => {

            const option =
                document.createElement("option");

            option.value = surah.number;

            option.textContent =
                surah.number +
                ". " +
                surah.englishName +
                " — " +
                surah.name;

            select.appendChild(option);

        });

        select.value = "1";

        loadSurah();

    } catch(error) {

        document.getElementById("quran").innerHTML =
            "<p>Unable to load Quran. Please check your internet connection.</p>";

        console.error(error);
    }
}


// -----------------------------------------
// LOAD SELECTED SURAH
// -----------------------------------------

async function loadSurah() {

    const number =
        document.getElementById("surahSelect").value;

    if (!number) return;

    document.getElementById("quran").innerHTML =
        '<div class="loading">Loading Quran...</div>';

    try {

        /*
          Arabic + English + Tamil
        */

        const arabicPromise =
            fetch(
                `${API}/surah/${number}/quran-uthmani`
            );

        const englishPromise =
            fetch(
                `${API}/surah/${number}/en.sahih`
            );

        /*
          Tamil edition
        */

        const tamilPromise =
            fetch(
                `${API}/surah/${number}/ta.tamil`
            );

        const results =
            await Promise.all([
                arabicPromise,
                englishPromise,
                tamilPromise
            ]);

        const arabic =
            await results[0].json();

        const english =
            await results[1].json();

        const tamil =
            await results[2].json();

        currentSurah = arabic.data;

        ayahs = [];

        for (
            let i = 0;
            i < currentSurah.ayahs.length;
            i++
        ) {

            ayahs.push({

                number:
                    currentSurah.ayahs[i].numberInSurah,

                globalNumber:
                    currentSurah.ayahs[i].number,

                arabic:
                    currentSurah.ayahs[i].text,

                english:
                    english.data.ayahs[i].text,

                tamil:
                    tamil.data.ayahs[i].text

            });

        }

        document.getElementById("surahName").textContent =
            currentSurah.englishName +
            " — " +
            currentSurah.name;

        document.getElementById("surahInfo").textContent =
            currentSurah.englishNameTranslation +
            " • " +
            currentSurah.numberOfAyahs +
            " Ayahs";

        renderQuran();

        document.getElementById("startAyah").max =
            currentSurah.numberOfAyahs;

        document.getElementById("endAyah").max =
            currentSurah.numberOfAyahs;

        document.getElementById("endAyah").value =
            Math.min(
                9,
                currentSurah.numberOfAyahs
            );

    } catch(error) {

        console.error(error);

        document.getElementById("quran").innerHTML =
            `
            <div class="loading">
                ❌ Could not load the Quran.
                <br><br>
                Check your internet connection.
            </div>
            `;
    }
}


// -----------------------------------------
// DISPLAY QURAN
// -----------------------------------------

function renderQuran() {

    const container =
        document.getElementById("quran");

    container.innerHTML = "";

    ayahs.forEach(ayah => {

        const div =
            document.createElement("div");

        div.className = "ayah";

        div.id =
            "ayah-" + ayah.number;

        div.innerHTML = `

            <div class="ayah-number">
                ${ayah.number}
            </div>

            <div class="arabic">
                ${ayah.arabic}
            </div>

            <div class="meaning ${meaningVisible ? "" : "hidden"}">

                <strong>🇬🇧 English</strong>

                <p>
                    ${ayah.english}
                </p>

            </div>

            <div class="meaning ${meaningVisible ? "" : "hidden"}">

                <strong>🇱🇰 தமிழ்</strong>

                <p>
                    ${ayah.tamil}
                </p>

            </div>

        `;

        container.appendChild(div);

    });
}


// -----------------------------------------
// MEANING ON / OFF
// -----------------------------------------

function toggleMeaning() {

    meaningVisible =
        !meaningVisible;

    document
        .querySelectorAll(".meaning")
        .forEach(element => {

            if (meaningVisible) {

                element.classList.remove("hidden");

            } else {

                element.classList.add("hidden");

            }

        });

}


// -----------------------------------------
// START REPEAT
// -----------------------------------------

function startRepeat() {

    if (!currentSurah) {

        alert("Please choose a Surah first.");

        return;
    }

    repeatStart =
        parseInt(
            document.getElementById("startAyah").value
        );

    repeatEnd =
        parseInt(
            document.getElementById("endAyah").value
        );

    if (
        isNaN(repeatStart) ||
        isNaN(repeatEnd)
    ) {

        alert("Enter valid Ayah numbers.");

        return;
    }

    if (
        repeatStart < 1 ||
        repeatEnd > currentSurah.numberOfAyahs ||
        repeatStart > repeatEnd
    ) {

        alert(
            "Please enter a valid Ayah range."
        );

        return;
    }

    repeating = true;

    currentPlayIndex =
        repeatStart - 1;

    playCurrentAyah();

}


// -----------------------------------------
// PLAY CURRENT AYAH
// -----------------------------------------

function playCurrentAyah() {

    if (!repeating) return;

    if (
        currentPlayIndex < repeatStart - 1 ||
        currentPlayIndex > repeatEnd - 1
    ) {

        currentPlayIndex =
            repeatStart - 1;

    }

    const ayah =
        ayahs[currentPlayIndex];

    if (!ayah) return;

    highlightAyah(
        ayah.number
    );

    const reciter =
        document.getElementById("reciter").value;

    /*
      Al Quran Cloud audio CDN.
      The Quran has 6236 ayahs and the
      CDN supports ayah-by-ayah audio.
    */

    audio.src =
        `https://cdn.islamic.network/quran/audio/128/${reciter}/${ayah.globalNumber}.mp3`;

    document.getElementById("status").textContent =
        `▶ Playing Ayah ${ayah.number} of ${repeatEnd}`;

    audio.play().catch(error => {

        console.log(error);

        document.getElementById("status").textContent =
            "Press Start Repeat again to play.";

    });

}


// -----------------------------------------
// WHEN AYAH FINISHES
// -----------------------------------------

audio.addEventListener(
    "ended",
    function() {

        if (!repeating) return;

        currentPlayIndex++;

        /*
          If we reached the end of the
          selected range, go back to start.
        */

        if (
            currentPlayIndex >
            repeatEnd - 1
        ) {

            currentPlayIndex =
                repeatStart - 1;

        }

        playCurrentAyah();

    }
);


// -----------------------------------------
// HIGHLIGHT PLAYING AYAH
// -----------------------------------------

function highlightAyah(number) {

    document
        .querySelectorAll(".ayah")
        .forEach(element => {

            element.classList.remove("active");

        });

    const element =
        document.getElementById(
            "ayah-" + number
        );

    if (element) {

        element.classList.add("active");

        element.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }

}


// -----------------------------------------
// PAUSE
// -----------------------------------------

function pauseAudio() {

    audio.pause();

    document.getElementById("status").textContent =
        "⏸ Paused";

}


// -----------------------------------------
// STOP
// -----------------------------------------

function stopAudio() {

    repeating = false;

    audio.pause();

    audio.currentTime = 0;

    document
        .querySelectorAll(".ayah")
        .forEach(element => {

            element.classList.remove("active");

        });

    document.getElementById("status").textContent =
        "⏹ Stopped";

}


// -----------------------------------------
// CHANGE RECITER
// -----------------------------------------

document
    .getElementById("reciter")
    .addEventListener(
        "change",
        function() {

            if (repeating) {

                audio.pause();

                playCurrentAyah();

            }

        }
    );


// -----------------------------------------
// START APP
// -----------------------------------------

loadSurahList();

</script>

</body>
</html>
